<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f7">
    <title>FlapRisk — Acceso</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <svg viewBox="0 0 48 48" fill="none">
                <circle cx="24" cy="24" r="22" stroke="#0071e3" stroke-width="2.5"/>
                <path d="M16 24c0-4.4 3.6-8 8-8s8 3.6 8 8-3.6 8-8 8" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="24" cy="24" r="3.5" fill="#0071e3"/>
            </svg>
        </div>
        <h1>FlapRisk</h1>
        <p class="login-subtitle">Prediccion de complicaciones vasculares en colgajo libre</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="off">
            <div class="field">
                <label for="access_key">Clave de acceso</label>
                <input type="password" id="access_key" name="access_key" required
                       placeholder="Ingrese la clave" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary btn-full">Ingresar</button>
        </form>

        <p class="disclaimer-small">Uso exclusivo para profesionales de salud autorizados en el estudio de validacion prospectiva.</p>
    </div>
</body>
</html>
