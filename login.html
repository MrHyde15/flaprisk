<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f5f7">
    <title>FlapRisk — Acceso</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/img/apple-touch-icon.png">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-logo">
            <img src="/static/img/logo_v2.png" alt="FlapRisk" class="login-logo-img">
        </div>
        <h1>FlapRisk</h1>
        <p class="login-subtitle">Predicción de complicaciones vasculares en colgajo libre</p>

        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" autocomplete="off">
            <div class="field">
                <label for="access_key">Clave de acceso</label>
                <input type="password" id="access_key" name="access_key" required
                       placeholder="Ingrese la clave" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary btn-full">Ingresar</button>
        </form>

        <p class="disclaimer-small">Uso exclusivo para profesionales de salud autorizados en el estudio de validación prospectiva.</p>
    </div>
</body>
</html>
